<mat-card class="book-details-card">
    <mat-card-header>
      <mat-card-title>{{ book.title }}</mat-card-title>
      <mat-card-subtitle>Publicado el {{ book.publishDate | date:'longDate' }}</mat-card-subtitle>
    </mat-card-header>
  
    <mat-card-content>
      <p><strong>Descripción:</strong> {{ book.description }}</p>
      <p><strong>Extracto:</strong> "{{ book.excerpt }}"</p>
      <p><strong>Número de páginas:</strong> {{ book.pageCount }}</p>
    </mat-card-content>
  
    <mat-card-actions align="end">
      <button mat-button color="primary" (click)="closeDialog()">Cerrar</button>
    </mat-card-actions>
</mat-card>
