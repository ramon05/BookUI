<div class="create-book-container">
  <mat-card class="create-book-card">
    <!-- Card Header -->
    <mat-card-header class="card-header">
      <mat-card-title class="card-title">Add New Book</mat-card-title>
    </mat-card-header>

    <!-- Card Content -->
    <mat-card-content>
      <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
        <!-- Title Field -->
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Title</mat-label>
            <input
              matInput
              formControlName="title"
              placeholder="Enter the book title"
              required
            />
          </mat-form-field>
        </div>

        <!-- Description Field -->
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Description</mat-label>
            <textarea
              matInput
              formControlName="description"
              placeholder="Enter the book description"
              rows="4"
              required
            ></textarea>
          </mat-form-field>
        </div>

        <!-- Page Count Field -->
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Page Count</mat-label>
            <input
              matInput
              formControlName="pageCount"
              type="number"
              placeholder="Enter the number of pages"
              required
            />
          </mat-form-field>
        </div>

        <!-- Publish Date Field con Datepicker -->
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Publish Date</mat-label>
            <input
              matInput
              formControlName="publishDate"
              [matDatepicker]="picker"
              placeholder="Choose a date"
              required
            />
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
        </div>

        <!-- Form Actions -->
        <div class="form-actions">
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="bookForm.invalid"
            class="action-button"
          >
            Save Book
          </button>
          <button
            mat-button
            color="warn"
            type="button"
            (click)="cancel()"
            class="action-button"
          >
            Cancel
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
