<div class="table-container">
    <h3>Listados de Libros</h3>

    <div class="table-header">
        <!-- <button mat-flat-button color="primary" (click)="openCreateBookModal()">Add Book</button> -->
        <button mat-flat-button (click)="openCreateBookModal()">Add Book</button>
      </div>

    <table mat-table [dataSource]="books" class="mat-elevation-z8">
  
      <!-- Título -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef> Título </th>
        <td mat-cell *matCellDef="let book"> {{ book.title }} </td>
      </ng-container>
  
      <!-- Número de Páginas -->
      <ng-container matColumnDef="pageCount">
        <th mat-header-cell *matHeaderCellDef> Páginas </th>
        <td mat-cell *matCellDef="let book"> {{ book.pageCount }} </td>
      </ng-container>
  
      <!-- Fecha de Publicación -->
      <ng-container matColumnDef="publishDate">
        <th mat-header-cell *matHeaderCellDef> Publicación </th>
        <td mat-cell *matCellDef="let book"> {{ book.publishDate | date }} </td>
      </ng-container>
  
      <!-- Acciones -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="acciones-column"> Acciones </th>
        <td mat-cell *matCellDef="let book" class="acciones-column">
          <!-- <button mat-button color="primary">Editar</button> -->
          <button mat-button color="primary" (click)="openCreateBookModal(book)">Edit</button>
          <button mat-button color="warn" (click)="deleteBook(book.id)">Eliminar</button>
          <button mat-button color="primary" (click)="openBookDetails(book.id)">Ver Detalles</button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
