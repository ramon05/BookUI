<div class="table-container">
  
  <div class="table-header">
    <h3>Listados de Libros</h3>
    <button mat-flat-button (click)="openCreateBookModal()">
      <span style="color: white;">✚</span> Add Book
    </button>
  </div>

  <table mat-table [dataSource]="books" class="mat-elevation-z8 custom-table">
  
    <!-- Título -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef> Título </th>
      <td mat-cell *matCellDef="let book"> {{ book.title }} </td>
    </ng-container>

    <!-- Número de Páginas -->
    <ng-container matColumnDef="pageCount">
      <th mat-header-cell *matHeaderCellDef> Páginas </th>
      <td mat-cell *matCellDef="let book"> {{ book.pageCount }} </td>
    </ng-container>

    <!-- Fecha de Publicación -->
    <ng-container matColumnDef="publishDate">
      <th mat-header-cell *matHeaderCellDef> Publicación </th>
      <td mat-cell *matCellDef="let book"> {{ book.publishDate | date }} </td>
    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="acciones-column"> Acciones </th>
      <td mat-cell *matCellDef="let book" class="acciones-column">
        <button  mat-button (click)="openCreateBookModal(book)" matTooltip="Editar libro" matTooltipPosition="above">
          ✏️ 
        </button>
        <button  mat-button (click)="deleteBook(book.id)" matTooltip="Eliminar libro" matTooltipPosition="above">
          ❌ 
        </button>
        <button  mat-button (click)="openBookDetails(book.id)"  matTooltip="Ver detalles" matTooltipPosition="above">
          🔍 
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
